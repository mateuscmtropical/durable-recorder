name: Feature request
description: Suggest a feature or an improvement
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the idea. Describe the problem first, then the change you would like to see.

  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Describe the situation, for example a browser, device or recording case the library does not handle well.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What the library should do. A short code sketch of the API is welcome.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you considered
      description: Workarounds you use now, or other ways to solve the problem.
