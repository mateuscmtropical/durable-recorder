name: Linked issue

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions:
  contents: read

jobs:
  linked-issue:
    name: Linked issue
    runs-on: ubuntu-latest
    # Dependabot opens its own pull requests without an issue.
    if: github.event.pull_request.user.login != 'dependabot[bot]'
    steps:
      - name: Check that the pull request closes an issue
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          if printf '%s' "$PR_BODY" | grep -Eiq '(close[sd]?|fix(e[sd])?|resolve[sd]?) #[0-9]+'; then
            echo "Linked issue found."
          else
            echo "::error::Link the issue this pull request solves, for example 'Closes #12'."
            exit 1
          fi
